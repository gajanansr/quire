name: Release

# Publishing is a decision, never a consequence of pushing code — so this runs only
# when it is started by hand, and the default track is the one nobody can see.
#
# Everything it needs is described in docs/release.md. Before the first run, note the
# constraint that catches everyone: **the Google Play Developer API cannot create an
# app's first release.** The very first bundle has to be uploaded through the Play
# Console by hand. After that, this workflow owns the pipe.
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track'
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      versionName:
        description: 'Version name, e.g. 0.2.0 (blank keeps the one in build.gradle.kts)'
        required: false
        type: string
      versionCode:
        description: 'Version code — must be higher than anything already uploaded (blank keeps the one in build.gradle.kts)'
        required: false
        type: string
      rollout:
        description: 'Fraction for a staged production rollout, e.g. 0.1 for 10% (blank ships to everyone)'
        required: false
        type: string
      dryRun:
        description: 'Build and sign, but do not upload to Play'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

# One release at a time, and never cancel one midway: a half-finished upload leaves a
# draft release in the Console that has to be cleaned up by hand.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: play

    steps:
      - uses: actions/checkout@v4

      # Fail here, loudly, rather than after a six-minute build. A missing secret is
      # the most likely reason this workflow ever fails, and the message should say
      # which one rather than surfacing as a Gradle error about a null keystore.
      - name: Check the secrets are present
        env:
          KEYSTORE: ${{ secrets.QUIRE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.QUIRE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QUIRE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QUIRE_KEY_PASSWORD }}
          SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          [ -z "$KEYSTORE" ]       && missing="$missing QUIRE_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing QUIRE_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]      && missing="$missing QUIRE_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]   && missing="$missing QUIRE_KEY_PASSWORD"
          if [ "${{ inputs.dryRun }}" != "true" ] && [ -z "$SERVICE_ACCOUNT" ]; then
            missing="$missing PLAY_SERVICE_ACCOUNT_JSON"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see docs/release.md §4"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # The same gate the project uses everywhere else. Nothing ships red.
      - name: Gate
        run: ./scripts/check.sh

      - name: Check the listing is still valid
        run: ./scripts/check-listing.sh

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.QUIRE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          # Never echo the path's contents, and never leave it in the workspace where
          # a later step could archive it into an artifact.
          test -s "$RUNNER_TEMP/upload.jks"

      - name: Build the bundle
        env:
          QUIRE_KEYSTORE: ${{ runner.temp }}/upload.jks
          QUIRE_KEYSTORE_PASSWORD: ${{ secrets.QUIRE_KEYSTORE_PASSWORD }}
          QUIRE_KEY_ALIAS: ${{ secrets.QUIRE_KEY_ALIAS }}
          QUIRE_KEY_PASSWORD: ${{ secrets.QUIRE_KEY_PASSWORD }}
        run: |
          args=""
          [ -n "${{ inputs.versionName }}" ] && args="$args -PquireVersionName=${{ inputs.versionName }}"
          [ -n "${{ inputs.versionCode }}" ] && args="$args -PquireVersionCode=${{ inputs.versionCode }}"
          ./gradlew :app:bundleRelease $args

      # Proves the artifact is signed before it is offered to anyone. A bundle that
      # reaches Play unsigned is rejected; one that reaches a tester unsigned is worse.
      - name: Verify the signature
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab \
            | tee /dev/stderr | grep -q "jar verified"

      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: quire-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload to Play
        if: ${{ inputs.dryRun != true }}
        # Pin this to a commit SHA rather than a tag before you rely on it: a moving
        # tag on a third-party action is a supply-chain hole, and this is the one step
        # in the repository that handles the signing key and the Play credentials.
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.quire.android
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          userFraction: ${{ inputs.rollout }}
          status: ${{ inputs.rollout && 'inProgress' || 'completed' }}
          # The listing copy and the release notes come from the repository, so the
          # words on the store page are reviewed the same way the code is.
          whatsNewDirectory: fastlane/metadata/android/en-US/changelogs
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      - name: Tag the release
        if: ${{ inputs.dryRun != true && inputs.versionName != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${{ inputs.versionName }}"
          git push origin "v${{ inputs.versionName }}"
          gh release create "v${{ inputs.versionName }}" \
            app/build/outputs/bundle/release/app-release.aab \
            --title "Quire ${{ inputs.versionName }}" \
            --notes-file fastlane/metadata/android/en-US/changelogs/${{ inputs.versionCode }}.txt
